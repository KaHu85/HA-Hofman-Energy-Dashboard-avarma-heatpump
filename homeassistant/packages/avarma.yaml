input_text:
  wp_code:
    name: WP Code eingeben
    mode: password
    max: 8
    icon: 'mdi:lock'
input_boolean:
  wp_benutzer_freigabe:
    name: WP Benutzer-Freigabe
    icon: 'mdi:lock-open-variant'
  wp_techniker_freigabe:
    name: WP Techniker-Freigabe
    icon: 'mdi:account-hard-hat'
template:
- sensor:
  - name: WP Spreizung VL-RL
    unique_id: avarma_spreizung
    unit_of_measurement: K
    state_class: measurement
    state: '{{ (states(''sensor.wp_vorlauf_tout'')|float(0) - states(''sensor.wp_rucklauf_tin'')|float(0))|round(1) }}'
    availability: '{{ has_value(''sensor.wp_vorlauf_tout'') and has_value(''sensor.wp_rucklauf_tin'') }}'
  - name: WP Thermische Leistung
    unique_id: avarma_waermeleistung
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    state: '{% set q=states(''sensor.wp_durchfluss_q'')|float(0) %}{% set dt=states(''sensor.wp_vorlauf_tout'')|float(0)-states(''sensor.wp_rucklauf_tin'')|float(0) %}{{ [q*dt*0.0698,0]|max|round(2) }}'
    availability: '{{ has_value(''sensor.wp_durchfluss_q'') }}'
  - name: WP Modus
    unique_id: avarma_modus_text
    state: '{{ {''2'':''Heizen'',''4'':''Kühlen'',''1'':''Warmwasser'',''3'':''Heizen+WW'',''5'':''Kühlen+WW''}.get(states(''sensor.wp_modus_wahl_roh''), states(''sensor.wp_modus_wahl_roh'')) }}'
    availability: '{{ has_value(''sensor.wp_modus_wahl_roh'') }}'
  - name: WP Ø Laufzeit pro Start heute
    unique_id: avarma_avg_laufzeit
    unit_of_measurement: min
    icon: 'mdi:timer-outline'
    state: '{% set h=states(''sensor.wp_kompressor_laufzeit_heute'')|float(0) %}{% set n=states(''sensor.wp_kompressor_starts_heute'')|int(0) %}{{ (h*60/n)|round(0) if n>0 else 0 }}'
  - name: WP Wärme heute
    unique_id: avarma_waerme_heute
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    state: '{{ ((states(''sensor.wp_energie_erzeugt_stunden_roh'').split('','') | map(''int'', 0) | sum) / 10) | round(1) }}'
    availability: '{{ has_value(''sensor.wp_energie_erzeugt_stunden_roh'') and '','' in states(''sensor.wp_energie_erzeugt_stunden_roh'') }}'
  - name: WP Strom heute
    unique_id: avarma_strom_heute
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    state: '{{ ((states(''sensor.wp_energie_verbraucht_stunden_roh'').split('','') | map(''int'', 0) | sum) / 10) | round(1) }}'
    availability: '{{ has_value(''sensor.wp_energie_verbraucht_stunden_roh'') and '','' in states(''sensor.wp_energie_verbraucht_stunden_roh'') }}'
  - name: WP Wärme Monat (Display)
    unique_id: avarma_waerme_monat_disp
    unit_of_measurement: kWh
    device_class: energy
    state: '{{ ((states(''sensor.wp_energie_erzeugt_tage_roh'').split('','') | map(''int'', 0) | sum) / 10) | round(1) }}'
    availability: '{{ has_value(''sensor.wp_energie_erzeugt_tage_roh'') and '','' in states(''sensor.wp_energie_erzeugt_tage_roh'') }}'
  - name: WP Strom Monat (Display)
    unique_id: avarma_strom_monat_disp
    unit_of_measurement: kWh
    device_class: energy
    state: '{{ ((states(''sensor.wp_energie_verbraucht_tage_roh'').split('','') | map(''int'', 0) | sum) / 10) | round(1) }}'
    availability: '{{ has_value(''sensor.wp_energie_verbraucht_tage_roh'') and '','' in states(''sensor.wp_energie_verbraucht_tage_roh'') }}'
  - name: WP COP heute
    unique_id: avarma_cop_heute
    icon: 'mdi:approximately-equal'
    state: '{% set w=states(''sensor.wp_warme_heute'')|float(0) %}{% set s=states(''sensor.wp_strom_heute'')|float(0) %}{{ (w/s)|round(2) if s>0 else 0 }}'
  - name: WP Aktive Fehler
