      - action: persistent_notification.create
        data:
          title: 'Wärmepumpe: Parameter gesperrt'
          message: P02 wurde NICHT geändert. Zuerst Benutzer-Code (99) oder Techniker-Code eingeben.
          notification_id: avarma_lock
      - stop: gesperrt
    - action: modbus.write_register
      data:
        hub: avarma
        slave: 1
        address: 4098
        value: '{% set r = (value / 1) | round(0) | int %}{{ r if r >= 0 else r + 65536 }}'
    - delay:
        seconds: 2
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.wp_vorlauf_soll_p2
    - action: logbook.log
