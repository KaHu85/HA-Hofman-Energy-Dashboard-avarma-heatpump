        data:
          title: 'Wärmepumpe: Parameter gesperrt'
          message: P01 wurde NICHT geändert. Zuerst Benutzer-Code (99) oder Techniker-Code eingeben.
          notification_id: avarma_lock
      - stop: gesperrt
    - action: modbus.write_register
      data:
        hub: avarma
        slave: 1
        address: 4097
        value: '{{ {''Warmwasser'': 1, ''Heizen'': 2, ''Heizen + Warmwasser'': 3, ''Kühlen'': 4, ''Kühlen + Warmwasser'': 5}[option] }}'
    - delay:
        seconds: 2
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.wp_modus_wahl_roh
    - action: logbook.log
      data:
        name: Wärmepumpe
        message: 'Betriebsart auf {{ option }} gesetzt'
        entity_id: sensor.wp_modus_wahl_roh
  button:
  - name: WP Fehler quittieren
    unique_id: avarma_fehler_reset
    icon: 'mdi:alert-remove'
    press:
    - action: modbus.write_register
      data:
        hub: avarma
        slave: 1
        address: 4104
        value: 1
    - delay:
        seconds: 3
    - action: homeassistant.update_entity
      target:
        entity_id:
        - sensor.wp_fehlerregister_0
        - sensor.wp_fehlerregister_1
        - sensor.wp_fehlerregister_2
        - sensor.wp_fehlerregister_3
        - sensor.wp_treiber_fehler_0
    - action: logbook.log
      data:
        name: Wärmepumpe
        message: Fehler quittiert
  - name: WP Uhr stellen
    unique_id: avarma_uhr_stellen
    icon: 'mdi:clock-edit'
    press:
    - action: modbus.write_register
      data:
        hub: avarma
        slave: 1
        address: 4106
        value: '{{ now().month * 256 + now().day }}'
    - action: modbus.write_register
      data:
        hub: avarma
        slave: 1
        address: 4107
        value: '{{ now().hour * 256 + now().minute }}'
    - delay:
        seconds: 2
    - action: homeassistant.update_entity
      target:
        entity_id:
        - sensor.wp_uhr_monat_tag_roh
        - sensor.wp_uhr_stunde_minute_roh
sensor:
- platform: history_stats
  name: WP Kompressor Laufzeit heute
  unique_id: avarma_laufzeit_heute
  entity_id: binary_sensor.wp_kompressor_lauft
  state: 'on'
  type: time
  start: '{{ today_at() }}'
  end: '{{ now() }}'
- platform: history_stats
  name: WP Kompressor Starts 24 h
  unique_id: avarma_starts_24h
  entity_id: binary_sensor.wp_kompressor_lauft
  state: 'on'
  type: count
  end: '{{ now() }}'
  duration:
    hours: 24
utility_meter:
  wp_kompressor_starts_heute:
    name: WP Kompressor-Starts heute
    unique_id: avarma_um_starts_tag
    source: sensor.wp_kompressor_starts_gesamt
    cycle: daily
  wp_kompressor_starts_woche:
    name: WP Kompressor-Starts Woche
    unique_id: avarma_um_starts_woche
    source: sensor.wp_kompressor_starts_gesamt
    cycle: weekly
  wp_warme_woche:
    name: WP Wärme Woche
    unique_id: avarma_um_waerme_woche
    source: sensor.wp_warme_heute
    cycle: weekly
  wp_strom_woche:
    name: WP Strom Woche
    unique_id: avarma_um_strom_woche
    source: sensor.wp_strom_heute
    cycle: weekly
  wp_kompressor_starts_monat:
    name: WP Kompressor-Starts Monat
    unique_id: avarma_um_starts_monat
    source: sensor.wp_kompressor_starts_gesamt
    cycle: monthly
  wp_warme_monat:
    name: WP Wärme Monat
    unique_id: avarma_um_waerme_monat
    source: sensor.wp_warme_heute
    cycle: monthly
  wp_strom_monat:
    name: WP Strom Monat
    unique_id: avarma_um_strom_monat
    source: sensor.wp_strom_heute
    cycle: monthly
  wp_kompressor_starts_jahr:
    name: WP Kompressor-Starts Jahr
    unique_id: avarma_um_starts_jahr
    source: sensor.wp_kompressor_starts_gesamt
    cycle: yearly
  wp_warme_jahr:
    name: WP Wärme Jahr
    unique_id: avarma_um_waerme_jahr
    source: sensor.wp_warme_heute
    cycle: yearly
  wp_strom_jahr:
    name: WP Strom Jahr
    unique_id: avarma_um_strom_jahr
    source: sensor.wp_strom_heute
    cycle: yearly
automation:
- id: avarma_code
  alias: 'WP: Code prüfen'
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_text.wp_code
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state not in ['''', ''unknown'', ''unavailable''] }}'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_text.wp_code
        state: !secret wp_code_techniker
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.wp_techniker_freigabe
          - input_boolean.wp_benutzer_freigabe
    - conditions:
      - condition: state
        entity_id: input_text.wp_code
        state: '99'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wp_benutzer_freigabe
    default:
    - action: persistent_notification.create
      data:
        title: Wärmepumpe
        message: Falscher Code.
        notification_id: avarma_lock
  - action: input_text.set_value
    target:
      entity_id: input_text.wp_code
    data:
      value: ''
- id: avarma_freigabe_timeout
  alias: 'WP: Freigabe nach 15 min sperren'
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.wp_benutzer_freigabe
    - input_boolean.wp_techniker_freigabe
    to: 'on'
    for:
      minutes: 15
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: '{{ trigger.entity_id }}'
- id: avarma_fehler_meldung
  alias: 'WP: Fehler melden'
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.wp_aktive_fehler
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state not in [''keine'', ''unknown'', ''unavailable''] and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - action: persistent_notification.create
    data:
      title: 'Wärmepumpe: Störung'
      message: 'Aktive Fehler: {{ trigger.to_state.state }} ({{ now().strftime(''%d.%m.%Y %H:%M'') }})'
      notification_id: avarma_fehler
- id: avarma_uhr_sync
  alias: 'WP: Uhr täglich stellen'
  triggers:
  - trigger: time
    at: '03:17:00'
  actions:
  - action: button.press
    target:
      entity_id: button.wp_uhr_stellen
- id: avarma_r290_alarm
  alias: 'WP: Kältemittel-ALARM (R290)'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.wp_kaltemittel_alarm
    to: 'on'
  - trigger: numeric_state
    entity_id: sensor.wp_kaltemittel_konzentration
    above: 0
  - trigger: template
    value_template: '{{ ''E51'' in states(''sensor.wp_aktive_fehler'') }}'
  actions:
  - action: persistent_notification.create
    data:
      title: '⚠️ WÄRMEPUMPE: KÄLTEMITTEL-ALARM'
      message: 'Die Wärmepumpe meldet Kältemittel (R290/Propan) – Konzentration {{ states(''sensor.wp_kaltemittel_konzentration'') }} %, Fehler: {{ states(''sensor.wp_aktive_fehler'') }}. Keine Zündquellen, Bereich lüften, WP stromlos schalten, Fachbetrieb rufen.'
      notification_id: avarma_r290
  - action: notify.notify
    continue_on_error: true
    data:
      title: '⚠️ Wärmepumpe: Kältemittel-ALARM'
      message: 'R290-Leck gemeldet ({{ states(''sensor.wp_kaltemittel_konzentration'') }} %). Keine Zündquellen, lüften, WP stromlos, Fachbetrieb rufen.'
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1.0
          interruption-level: critical
