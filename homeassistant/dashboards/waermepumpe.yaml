  - type: markdown
    title: Schreibvorgänge in die Wärmepumpe
    content: |-
      {% set sw = states['sensor.wp_schreibvorgange_heute'] %}{% if sw and sw.attributes.gesamt is defined %}{% set a = sw.attributes %}**Heute:** {{ sw.state }} · **gesamt:** {{ a.gesamt }} seit {{ a.seit }}

      {% macro liste(d) %}{% for k, v in (d or {}).items() %}{{ k }} {{ v }}{{ ' · ' if not loop.last }}{% else %}–{% endfor %}{% endmacro %}| Tag | Anzahl | Parameter | Herkunft |
      |:--|--:|:--|:--|
      | heute | {{ sw.state }} | {{ liste(a.je_parameter) }} | {{ liste(a.herkunft) }} |
      {% for d in a.verlauf or [] %}| {{ d.datum }} | {{ d.n }} | {{ liste(d.p) }} | {{ liste(d.wer) }} |
      {% endfor %}
      <small>Jeder Wert, den Home Assistant in die WP schreibt (Regelung, Übergangszeit, Änderungen auf den Parameterseiten, Uhr stellen). Die WP speichert Parameter dauerhaft, vermutlich in einem EEPROM/Flash mit typisch 100.000–1.000.000 Schreibzyklen je Speicherzelle. Bei 20 Schreibvorgängen am Tag sind das ~7.000 im Jahr – auch im ungünstigen Fall reicht das viele Jahre. Werte, die sich nicht ändern, werden nicht geschrieben.</small>{% else %}Noch keine Daten.{% endif %}
