        **P146 Heizkurve: Mindest-Vorlauf** – Untergrenze der Heizkurve (OTC-Minimum), wirkt bei P08 ≤ 50 (Werksliste: „OTC minimum setting value“).
        **P148 Zweite Temperaturzone: Soll** – Werksliste: „Dual temperature zone setting temperature“. In der Smart-Life-App „R2_setting“.
