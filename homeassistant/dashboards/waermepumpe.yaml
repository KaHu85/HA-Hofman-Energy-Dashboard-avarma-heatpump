        name: P86 · Abtau ΔT Außen–Lamelle (≥ −7 °C)
      - entity: number.wp_set_p91_abtau_dt_aussen_lamelle_7_degc
        name: P91 · Abtau ΔT Außen–Lamelle (< −7 °C)
      - entity: number.wp_set_p101_eev_schritte_beim_abtauen
        name: P101 · EEV-Schritte beim Abtauen
      grid_options:
        columns: full
    - type: markdown
      content: |-
        **P26 Abtau: Intervall-Faktor** – 0 = keine Abtauung, 1–4 = Intervall-Faktor (×4).
        **P27 Abtau: Zyklus** – Mindest-Laufzeit zwischen zwei Abtauungen.
        **P28 Abtaumodus** – 0 = automatisch. 1 = Abtauung manuell auslösen (springt danach auf 0).
        **P29 Abtau-Start Lamellentemp.** – Lamelle (Tc) muss unter diesen Wert fallen, damit abgetaut wird.
        **P30 Abtau-Ende Lamellentemp.** – Abtauung endet, wenn die Lamelle diese Temperatur erreicht.
        **P31 Abtau: max. Dauer** – Abtauung wird spätestens nach dieser Zeit beendet.
        **P47 Abtau-Frequenz** – Kompressorfrequenz während der Abtauung.
        **P85 Abtau: max. Außentemperatur** – Über dieser Außentemperatur taut die WP nicht selbst ab (Community-Tipp: 15 °C).
        **P86 Abtau ΔT Außen–Lamelle (≥ −7 °C)** – Geforderte Differenz Außenluft–Lamelle für den Abtaustart.
        **P91 Abtau ΔT Außen–Lamelle (< −7 °C)** – Wie P86, für Außentemperaturen unter −7 °C.
        **P101 EEV-Schritte beim Abtauen** – Ventilöffnung während der Abtauung.
      card_mod:
        style: ha-card{font-size:0.85em;opacity:0.85}
      grid_options:
        columns: full
