      - entity: number.wp_set_p113_eev_korrektur_intervall
        name: P113 · EEV-Korrektur Intervall
        werk: '30'
      grid_options:
        columns: full
    - type: markdown
      content: |-
        **P32 EEV Regelart** – 0 keine, 1 Prüfung (Check), 2 manuell, 3 Sauggas-Überhitzung, 4 Heißgas-Überhitzung.
        **P33 EEV manuell Heizen** – Feste Ventilöffnung im manuellen Modus (Heizen).
        **P34 EEV manuell Kühlen** – Feste Ventilöffnung im manuellen Modus (Kühlen). Achtung: Display zeigt 0, Register liest 400.
        **P49 Heißgas-Überhitzung P-Faktor** – Proportional-Koeffizient der Heißgas-Überhitzungsregelung.
        **P50 Heißgas-Überhitzung D-Faktor** – Differential-Koeffizient der Heißgas-Überhitzungsregelung.
        **P64 EEV Mindestöffnung** – Kleinste Öffnung des Expansionsventils.
        **P74 EVI: zuschalten ab Heißgastemperatur** – Ab dieser Heißgas-(Druckgas-)Temperatur wird die Zwischeneinspritzung (EVI) aktiv. ⚠️ Modbus-Protokoll (TDB 24.11.2025) nennt hier „Enthalpy injection valve control mode“ (0–3); der Wert 55 passt nur zur Werksliste.
        **P75 Unterkühlungs-EEV Heizen aktiv** – Regelung des Unterkühlungs-Expansionsventils im Heizbetrieb: 0 = aus, 1 = ein. ⚠️ Modbus-Protokoll (TDB 24.11.2025): „EVI valve initial opening heating“ (40–480).
        **P76 Heißgas-Überhitzung Soll** – Ziel-Überhitzung des Heißgases (Werksliste: „Discharge superheat“). ⚠️ Modbus-Protokoll (TDB 24.11.2025): „EVI valve initial opening cooling“ (40–480); der Wert 17 passt nur zur Werksliste.
        **P77 Unterkühlung max. Öffnung (Heißgas > 100 °C)** – Größte Öffnung des Unterkühlungsventils, wenn die Heißgastemperatur über 100 °C liegt. ⚠️ Modbus-Protokoll (TDB 24.11.2025): „Spray enthalpy valve superheat (heating)“ (−5…10 °C); der Wert 200 passt nur zur Werksliste.
        **P78 Unterkühlung max. Öffnung (Heißgas 90–100 °C)** – Größte Öffnung des Unterkühlungsventils bei Heißgastemperatur über 90 bis 100 °C. ⚠️ Modbus-Protokoll (TDB 24.11.2025): „Spray enthalpy valve superheat (cooling)“; der Wert 180 passt nur zur Werksliste.
        **P79 Unterkühlung max. Öffnung (Heißgas ≤ 90 °C)** – Größte Öffnung des Unterkühlungsventils bei Heißgastemperatur bis 90 °C. Früher hier fälschlich als WLAN-Upload-Intervall gedeutet. ⚠️ Modbus-Protokoll (TDB 24.11.2025): „WIFI data upload cycle“ (s); der Wert 150 = Werkswert der Werksliste.
        **P89 Sauggas-Überhitzung P-Faktor** – Proportional-Koeffizient der Sauggas-Überhitzungsregelung.
        **P90 Sauggas-Überhitzung D-Faktor** – Differential-Koeffizient der Sauggas-Überhitzungsregelung.
        **P92 Soll-Überhitzung Heizen (Außen ≤ −5 °C)** – Ziel-Überhitzung Sauggas (Außentemperatur-Bereich 1).
        **P93 Soll-Überhitzung Heizen (−5…5 °C)** – Ziel-Überhitzung Sauggas (Bereich 2).
        **P94 Soll-Überhitzung Heizen (5…25 °C)** – Ziel-Überhitzung Sauggas bei Außentemperatur +5 bis +25 °C.
        **P95 Soll-Überhitzung Kühlen** – Ziel-Überhitzung im Kühlbetrieb.
        **P96 Soll-Überhitzung Heizen (Außen ≥ 25 °C)** – Ziel-Überhitzung Sauggas bei Außentemperatur ab 25 °C.
        **P103 EEV Anfangsöffnung Haltezeit** – So lange bleibt das EEV nach dem Start auf Anfangsöffnung.
        **P112 EEV-Korrektur ab Heißgas** – Ab dieser Heißgastemperatur passt das EEV die Öffnung an.
        **P113 EEV-Korrektur Intervall** – Zeitintervall der EEV-Anpassung bei zu hoher Heißgastemperatur.
      grid_options:
        columns: full
