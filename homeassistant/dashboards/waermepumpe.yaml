        name: P93 · Soll-Überhitzung Heizen (−5…5 °C)
        werk: 2,5
      - entity: number.wp_set_p94_soll_uberhitzung_heizen_5_25_degc
        name: P94 · Soll-Überhitzung Heizen (5…25 °C)
        werk: '2'
      - entity: number.wp_set_p95_soll_uberhitzung_kuhlen
        name: P95 · Soll-Überhitzung Kühlen
        werk: '3'
      - entity: number.wp_set_p96_soll_uberhitzung_heizen_25_45_degc
        name: P96 · Soll-Überhitzung Heizen (Außen ≥ 25 °C)
        werk: 0,5
      - entity: number.wp_set_p103_eev_anfangsoffnung_haltezeit
        name: P103 · EEV Anfangsöffnung Haltezeit
        werk: '60'
