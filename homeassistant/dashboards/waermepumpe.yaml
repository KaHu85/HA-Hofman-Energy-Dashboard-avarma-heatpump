        {% macro n(v, d=0) %}{{ '–' if v is none or v is undefined else ('%.*f' | format(d, v)) | replace('.', ',') }}{% endmacro %}{% set M = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'] %}{% set a = states.sensor.wp_ubergangszeit_status.attributes if states.sensor.wp_ubergangszeit_status else {} %}{% set i = a.ist or {} %}{% set u = a.uebergang or {} %}{% set o = a.normal or {} %}**Status:** {{ states('sensor.wp_ubergangszeit_status') }}

