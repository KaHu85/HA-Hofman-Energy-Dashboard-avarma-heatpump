        **P32 EEV Regelart** – 0 keine, 1 Tabelle, 2 manuell, 3 Sauggas-Überhitzung, 4 Heißgas-Überhitzung.
        **P33 EEV manuell Heizen** – Feste Ventilöffnung im manuellen Modus (Heizen).
        **P34 EEV manuell Kühlen** – Feste Ventilöffnung im manuellen Modus (Kühlen). Achtung: Display zeigt 0, Register liest 400.
        **P49 Heißgas-Überhitzung P** – Regelparameter (Proportional).
        **P50 Heißgas-Überhitzung D** – Regelparameter (Differential).
        **P64 EEV Mindestöffnung** – Kleinste Öffnung des Expansionsventils.
        **P74 EVI-Ventil Regelart** – Regelung des EVI-(Einspritz-)Ventils.
        **P75 EVI Anfangsöffnung** – Startöffnung EVI-Ventil.
        **P76 EVI Parameter 76** – EVI-Regelparameter.
        **P77 EVI Überhitzung Heizen** – EVI-Regelparameter Heizen.
        **P78 EVI Überhitzung Kühlen** – EVI-Regelparameter Kühlen.
        **P89 Sauggas-Überhitzung P** – Regelparameter (Proportional).
        **P90 Sauggas-Überhitzung D** – Regelparameter (Differential).
        **P92 Soll-Überhitzung Heizen (Außen ≤ −5 °C)** – Ziel-Überhitzung Sauggas (Außentemperatur-Bereich 1).
        **P93 Soll-Überhitzung Heizen (−5…5 °C)** – Ziel-Überhitzung Sauggas (Bereich 2).
        **P94 Soll-Überhitzung Heizen (5…25 °C)** – Ziel-Überhitzung Sauggas (Bereich 3).
        **P95 Soll-Überhitzung Kühlen** – Ziel-Überhitzung im Kühlbetrieb.
        **P96 Soll-Überhitzung Heizen (25…45 °C)** – Ziel-Überhitzung bei hohem Vorlauf.
        **P103 EEV Anfangsöffnung Haltezeit** – So lange bleibt das EEV nach dem Start auf Anfangsöffnung.
        **P112 EEV-Korrektur ab Heißgas** – Ab dieser Druckgastemperatur öffnet das EEV zusätzlich.
        **P113 EEV-Korrektur Intervall** – Zeitintervall der Korrektur.
