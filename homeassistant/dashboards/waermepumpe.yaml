    - type: tile
      entity: sensor.wp_verdampfungstemperatur
      name: TL Verdampfung
      vertical: true
      grid_options:
        columns: 4
      icon: mdi:thermometer-low
    - type: tile
      entity: sensor.wp_uberhitzung
      name: Überhitzung
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.wp_unterkuhlung
      name: Unterkühlung
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.wp_temperaturhub
      name: Temperaturhub
      vertical: true
      grid_options:
        columns: 4
