        **P83 WW-Zirkulationspumpe Betrieb** – 0 = nein, 1 = Zeit, 2 = Temperaturdifferenz, 3 = Zeit + Temperaturdifferenz (nur bei P88 = 1).
        **P84 WW-Zirkulation Differenz** – Einschaltdifferenz der Zirkulationspumpe.
