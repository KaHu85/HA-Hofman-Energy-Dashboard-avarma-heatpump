        werk: '2'
      - entity: number.wp_set_p58_pumpe_regel_spreizung
        name: P58 · Pumpe Regel-Spreizung
        werk: '5'
      - entity: number.wp_set_p59_pumpe_mindestdrehzahl
        name: P59 · Pumpe Mindestdrehzahl
        werk: '8'
      - entity: number.wp_set_p61_mindestdurchfluss
        name: P61 · Mindestdurchfluss
        werk: '8'
      - entity: number.wp_set_p68_durchflusssensor_typ
        name: P68 · Durchflussschalter-Auswahl
        werk: '1'
      grid_options:
        columns: full
    - type: markdown
      content: |-
        **P26 Durchflussmesser-Modell** – Typ des eingebauten Durchflussmessers (Werksliste: „Water Flow Meter Model“). Nicht ändern. ⚠️ Modbus-Protokoll (TDB 24.11.2025) nennt hier „Defrost Interval Multiplier“ (0 = keine Abtauung, 1–4 = Intervall ×4). Welche Bedeutung für diese Firmware gilt, ist offen – nicht ändern.
        **P58 Pumpe Regel-Spreizung** – Auf diese Spreizung VL–RL regelt die drehzahlgeregelte Pumpe C1.
        **P59 Pumpe Mindestdrehzahl** – Untere Drehzahl der PWM-Pumpe, 2–8 (8 = 80 %).
        **P61 Mindestdurchfluss** – Unter diesem Durchfluss → Fehler E15. Nicht ohne Grund absenken.
        **P68 Durchflussschalter-Auswahl** – Werksliste: „Flow switch selection“, 0–5. Nur mit Hersteller-Freigabe ändern.
      grid_options:
        columns: full
    - type: custom:avarma-param-card
      title: Kompressor
      werk_title: Werk (9 kW)
      entities:
      - entity: number.wp_set_p40_festfrequenz_funktion
        name: 'P40 · Kompressorfrequenz: Automatik'
        werk: '1'
      - entity: number.wp_set_p41_olruckfuhrung_frequenz
        name: P41 · Ölrückführung Frequenz
        werk: '50'
      - entity: number.wp_set_p45_kompressor_max_frequenz
        name: P45 · Kompressor max. Frequenz
        werk: '85'
      - entity: number.wp_set_p46_kompressor_min_frequenz
        name: P46 · Kompressor min. Frequenz
        werk: '35'
      - entity: number.wp_set_p48_warmwasser_max_frequenz
        name: P48 · Warmwasser max. Frequenz
        werk: '10'
      - entity: number.wp_set_p80_mindestfrequenz_berechnung
        name: P80 · Mindestfrequenz-Berechnung
        werk: '1'
      - entity: number.wp_set_p104_kompressor_startfrequenz
        name: P104 · Frequenz für Leistungsberechnung
        werk: '50'
      - entity: number.wp_set_p105_startplateau_frequenz
        name: P105 · Startfrequenz A
        werk: '30'
      - entity: number.wp_set_p106_startplateau_dauer
        name: P106 · Startfrequenz A Dauer
        werk: '60'
      - entity: number.wp_set_p114_frequenzreduktion_bei_vl_soll
        name: P114 · Frequenzreduktion bei VL-Soll
        werk: '2'
      - entity: number.wp_set_p137_parameter_137
        name: P137 · Resonanzfrequenz 1
        werk: '0'
      - entity: number.wp_set_p138_parameter_138
        name: P138 · Resonanzfrequenz 2
        werk: '0'
      - entity: number.wp_set_p139_parameter_139
        name: P139 · Resonanzfrequenz 3
        werk: '0'
      - entity: number.wp_set_p140_parameter_140
        name: P140 · Resonanzfrequenz 4
        werk: '0'
      - entity: number.wp_set_p141_parameter_141
        name: P141 · Resonanzfrequenz 5
        werk: '0'
      - entity: number.wp_set_p142_parameter_142
        name: P142 · Resonanzfrequenz 6
        werk: '0'
      - entity: number.wp_set_p143_parameter_143
        name: P143 · Resonanzfrequenz 7
        werk: '0'
      - entity: number.wp_set_p144_parameter_144
        name: P144 · Resonanzfrequenz 8
        werk: '0'
      grid_options:
        columns: full
    - type: markdown
      content: |-
        **P40 Kompressorfrequenz: Automatik** – 0 = manuell (feste Frequenz P97), 1 = automatisch.
        **P41 Ölrückführung Frequenz** – Frequenz für die periodische Ölrückführung.
        **P45 Kompressor max. Frequenz** – Höchste Kompressorfrequenz (Leistungsgrenze, auch beim Abtauen wirksam).
        **P46 Kompressor min. Frequenz** – Niedrigste Frequenz. Kleiner = weiter herunter modulieren = weniger Takten.
        **P48 Warmwasser max. Frequenz** – Höchste Frequenz im Warmwasserbetrieb (Werksliste: „DHW maximum frequency“, 2–10, Einheit dort Hz – Bedeutung als Stufe/Faktor unklar). Modbus-Protokoll (TDB 24.11.2025): 2–10 = Prozentsatz der höchsten eingestellten Frequenz.
        **P80 Mindestfrequenz-Berechnung** – Koeffizient zur Berechnung der niedrigsten Kompressorfrequenz (Werksliste: Reserve).
        **P104 Frequenz für Leistungsberechnung** – Anfangsfrequenz des Kompressors für die Berechnung der Heiz-/Kühlleistung.
        **P105 Startfrequenz A** – Startfrequenz des Kompressors (Anlaufplateau A).
        **P106 Startfrequenz A Dauer** – So lange läuft der Kompressor nach dem Start auf Startfrequenz A.
        **P114 Frequenzreduktion bei VL-Soll** – Wie weit der Kompressor nach erreichtem Soll die Frequenz absenkt. Größer = weniger Takten (Community: 3 % → 15 % bei Takten).
        **P137 Resonanzfrequenz 1** – Frequenz, die der Kompressor überspringt, um Resonanzen (Brummen, Vibrationen) zu vermeiden. 0 = keine.
        **P138 Resonanzfrequenz 2** – Frequenz, die der Kompressor überspringt, um Resonanzen (Brummen, Vibrationen) zu vermeiden. 0 = keine.
        **P139 Resonanzfrequenz 3** – Frequenz, die der Kompressor überspringt, um Resonanzen (Brummen, Vibrationen) zu vermeiden. 0 = keine.
        **P140 Resonanzfrequenz 4** – Frequenz, die der Kompressor überspringt, um Resonanzen (Brummen, Vibrationen) zu vermeiden. 0 = keine.
        **P141 Resonanzfrequenz 5** – Frequenz, die der Kompressor überspringt, um Resonanzen (Brummen, Vibrationen) zu vermeiden. 0 = keine.
        **P142 Resonanzfrequenz 6** – Frequenz, die der Kompressor überspringt, um Resonanzen (Brummen, Vibrationen) zu vermeiden. 0 = keine.
        **P143 Resonanzfrequenz 7** – Frequenz, die der Kompressor überspringt, um Resonanzen (Brummen, Vibrationen) zu vermeiden. 0 = keine.
        **P144 Resonanzfrequenz 8** – Frequenz, die der Kompressor überspringt, um Resonanzen (Brummen, Vibrationen) zu vermeiden. 0 = keine.
      grid_options:
        columns: full
