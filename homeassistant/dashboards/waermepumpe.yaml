    - type: markdown
      title: Wetterprognose einrichten
      avarma_ohne_wetter: true
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.wp_raumtemperatur_mittel
          state_not:
          - unavailable
          - unknown
        - condition: state
          entity: switch.wp_eigene_regelung
          state: 'on'
      grid_options:
        columns: full
      content: |-
        Ohne Wetter-Entität fehlen der **Prognose-Baustein**, das **Vorladen vor Frost** und die Vorhersage hier auf der Seite. Die Regelung läuft trotzdem.

        1. Wetter mit Stundenprognose hinzufügen (ohne Konto, ohne API-Schlüssel): **Einstellungen → Geräte & Dienste → Integration hinzufügen → „Open-Meteo“** (für Österreich/Deutschland empfohlen, rechnet mit dem DWD-Modell ICON-D2). Met.no („Forecast Home“) richtet Home Assistant meist schon bei der Ersteinrichtung ein und geht auch.
        2. **Einstellungen → Geräte & Dienste → Avarma → Konfigurieren → „Wetter mit Stundenprognose“** wählen (ist vorgeschlagen) und speichern.

        <small>Bei Met.no die richtige Höhe unter **Einstellungen → System → Allgemein** eintragen – mit 0 m wird die Temperatur zu warm vorhergesagt.</small>
    - type: weather-forecast
      entity: weather.avarma_wetter
      forecast_type: hourly
      show_current: true
      show_forecast: true
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.wp_raumtemperatur_mittel
          state_not:
          - unavailable
          - unknown
        - condition: state
          entity: switch.wp_eigene_regelung
          state: 'on'
      grid_options:
        columns: full
    - type: custom:avarma-forecast-card
      entity: weather.avarma_wetter
      title: Temperaturprognose (nächste 24 h)
      hours: 24
      regelung: sensor.wp_regelung_verschiebung
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.wp_raumtemperatur_mittel
          state_not:
          - unavailable
          - unknown
        - condition: state
          entity: switch.wp_eigene_regelung
          state: 'on'
      grid_options:
        columns: full
    - type: markdown
      title: Wärmste Stunden – Auswertung je Tag
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.wp_raumtemperatur_mittel
          state_not:
          - unavailable
          - unknown
        - condition: state
          entity: switch.wp_eigene_regelung
          state: 'on'
      grid_options:
        columns: full
      content: |-
        {% macro n(v, d=0) %}{{ '–' if v is none or v is undefined else ('%.*f' | format(d, v)) | replace('.', ',') }}{% endmacro %}{% set M = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'] %}{% set a = states.sensor.wp_regelung_verschiebung.attributes if states.sensor.wp_regelung_verschiebung else {} %}{% set h = a.tag_hist or [] %}{% if h %}| Tag | Wärmste Std. | Außen Ø | Außen je kWh | Vorteil | Starts | Laufzeit | Wärme | Strom | COP |
        |:--|:-:|--:|--:|--:|--:|--:|--:|--:|--:|
        {% for d in h %}| {{ d.datum }} | {{ 'an' if d.an else 'aus' }} | {{ n(d.aussen, 1) }} °C | {{ n(d.aussen_w, 1) }} °C | {{ '–' if d.aussen_w is none or d.aussen_w is undefined else ('%+.1f' | format(d.aussen_w - d.aussen) | replace('.', ',')) }} K | {{ n(d.starts) }} | {{ n(d.laufzeit, 1) }} h | {{ n(d.waerme, 1) }} kWh | {{ n(d.strom, 1) }} kWh | {{ n(d.cop, 2) }} |
        {% endfor %}
        <small>„Außen je kWh“ = mittlere Außentemperatur, gewichtet mit der in jeder Minute erzeugten Wärme. „Vorteil“ = so viel wärmer war es draußen, während die Wärme erzeugt wurde, als im Tagesmittel. Je größer, desto mehr Wärme kam aus den warmen Stunden (je K etwa 2–3 % besserer COP). „Starts“ laut Zähler der WP – steigen sie mit dem Schalter an, kostet das Absenken in den kalten Stunden zusätzliche Starts. Wird immer aufgezeichnet, auch wenn der Schalter aus ist – so gibt es Vergleichstage. Wärme und Strom laut Zähler der WP.</small>{% else %}Die erste Zeile erscheint nach Mitternacht (Auswertung je abgeschlossenem Tag).{% endif %}
  - type: grid
    cards:
    - type: markdown
      title: Eigene Regelung einrichten
      visibility:
      - condition: state
