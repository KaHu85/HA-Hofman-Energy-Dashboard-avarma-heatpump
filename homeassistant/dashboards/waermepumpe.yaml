      content: |-
        **P25 Frostschutz-Temperatur** – Unter dieser Wassertemperatur startet der Frostschutz.
        **P42 Strom: keine Frequenzerhöhung ab** – Ab diesem Kompressorstrom wird die Frequenz nicht mehr erhöht.
        **P43 Strom: Frequenzabsenkung ab** – Ab diesem Strom wird die Frequenz reduziert.
        **P44 Strom: Abschaltung ab** – Ab diesem Strom schaltet der Kompressor ab.
        **P51 Hochdruck: keine Frequenzerhöhung ab** – Ab diesem Hochdruck keine Frequenzerhöhung mehr.
        **P52 Hochdruck: Sperre aufheben ab** – Unter diesem Hochdruck darf die Frequenz wieder steigen.
        **P53 Hochdruck-Abschaltung** – Schutzabschaltung bei zu hohem Druck.
        **P54 Niederdruck-Abschaltung** – Schutzabschaltung bei zu niedrigem Druck.
        **P55 Hochdruck-Schutz Hysterese** – Rückschaltdifferenz Hochdruckschutz.
        **P56 Niederdruck-Schutz Hysterese** – Rückschaltdifferenz Niederdruckschutz.
        **P57 Heißgas-Schutztemperatur** – Abschaltung bei zu hoher Druckgastemperatur (Td).
        **P73 Drucksensor/Druckschalter** – 0 = Drucksensor, 1 = Druckschalter.
        **P102 Schutzgrenze Spreizung VL/RL** – Maximal zulässige Spreizung, sonst Schutz.
        **P109 Heißgas-Grenze 1** – Frequenzbegrenzung ab dieser Druckgastemperatur (Stufe 1).
        **P110 Heißgas-Grenze 2** – Stufe 2.
        **P111 Heißgas-Grenze 3** – Stufe 3.
        **P115 Vorlauf-Übertemperaturschutz** – Schutzabschaltung bei zu hohem Vorlauf.
