        **P40 Festfrequenz-Funktion** – 0 = manuell, 1 = automatisch.
        **P41 Ölrückführung Frequenz** – Frequenz für die periodische Ölrückführung.
        **P45 Kompressor max. Frequenz** – Höchste Kompressorfrequenz (Leistungsgrenze, auch beim Abtauen wirksam).
        **P46 Kompressor min. Frequenz** – Niedrigste Frequenz. Kleiner = weiter herunter modulieren = weniger Takten.
        **P48 Warmwasser max. Frequenz** – Höchstfrequenz im WW-Betrieb als Faktor der höchsten eingestellten Frequenz.
        **P80 Mindestfrequenz-Berechnung** – Faktor für die Mindestfrequenz-Ermittlung.
        **P104 Kompressor Startfrequenz** – Startfrequenz für die Leistungsberechnung Heizen/Kühlen.
        **P105 Startplateau Frequenz** – Frequenz des Anlaufplateaus (Plattform A).
        **P106 Startplateau Dauer** – Haltezeit auf dem Anlaufplateau.
        **P114 Frequenzreduktion bei VL-Soll** – Wie weit der Kompressor bei erreichtem Soll herunter modulieren darf. Größer = weniger Takten (Community: 3 % statt 2 %).
