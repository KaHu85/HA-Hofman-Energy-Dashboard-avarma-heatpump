    - type: markdown
      content: |-
        **P27 Abtau: erstes Intervall** – Werksliste: „First Defrost Interval“ – Zeit bis zur ersten Abtauung. Beobachtet: wirkt wohl auch als Mindestabstand zwischen weiteren Abtauungen. Modbus-Protokoll (TDB 24.11.2025): „defrost cycle“, 15–99 min.
        **P28 Abtaumodus** – 0 = automatisch. 1 = Abtauung manuell auslösen (springt danach auf 0).
        **P29 Abtau-Start Lamellentemp.** – Lamelle (Tc) muss unter diesen Wert fallen, damit abgetaut wird.
        **P30 Abtau-Ende Lamellentemp.** – Abtauung endet, wenn die Lamelle diese Temperatur erreicht.
        **P31 Abtau: max. Dauer** – Abtauung wird spätestens nach dieser Zeit beendet.
        **P47 Abtau-Frequenz** – Kompressorfrequenz während der Abtauung.
        **P85 Abtau: Außentemperatur-Grenze** – Werksliste: „Defrost ambient temperature“. Über dieser Außentemperatur taut die WP nicht selbst ab (Community-Tipp: 15 °C).
        **P86 Abtau ΔT Außen–Lamelle (≥ −7 °C)** – Geforderte Differenz Außenluft–Lamelle (ΔT1) für den Abtaustart bei Außentemperatur ≥ −7 °C.
        **P91 Abtau ΔT Außen–Lamelle (< −7 °C)** – Geforderte Differenz Außenluft–Lamelle (ΔT2) für den Abtaustart bei Außentemperatur < −7 °C.
        **P101 EEV-Schritte beim Abtauen** – Ventilöffnung während der Abtauung.
