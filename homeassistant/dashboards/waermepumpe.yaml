      content: Die eigene Regelung verschiebt die **Heizkurve der WP** (P09) sanft nach deiner **Raumtemperatur**. Dafür in **Einstellungen → Geräte & Dienste → Avarma → Konfigurieren** einen oder mehrere **Raumfühler** wählen, optional einen **eigenen Außenfühler** und eine **Wetter-Entität**. Danach hier einschalten. Details im README.
