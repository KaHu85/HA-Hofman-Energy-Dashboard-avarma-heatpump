        **P03 Soll Kühlen** – Ziel-Vorlauftemperatur im Kühlbetrieb.
        **P05 Raum-Soll** – Raum-Solltemperatur (nur mit Raumfühler/Thermostat wirksam).
        **P06 Hysterese Heizen/Kühlen** – Um so viel muss der Vorlauf unter den Sollwert fallen, bis die WP wieder startet. Größer = weniger Takte, aber größere Schwankung.
        **P08 Heizkurve: max. Vorlauf** – Höchster Vorlauf, den die Heizkurve (AU) bei tiefster Außentemperatur vorgibt.
        **P09 Heizkurve: Verschiebung** – Parallelverschiebung der Heizkurve (+ = wärmer, − = kühler).
        **P19 Heizkurve (AU) aktiv** – 1 = Vorlauf wird nach Außentemperatur geführt (Heizkurve), 0 = fester Vorlauf-Soll P02.
        **P135 Heizgrenze (Heizkurve)** – Über dieser Außentemperatur heizt die WP nicht (Sommerabschaltung).
        **P136 Heizkurve: Wiedereinschalten unter** – Unter dieser Außentemperatur wird wieder geheizt.
