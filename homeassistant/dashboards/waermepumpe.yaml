      content: |-
        **P04 Warmwasser-Soll** – Zieltemperatur des Warmwasserspeichers. Der Kompressor heizt höchstens bis P35, darüber nur die E-Heizung.
        **P07 Hysterese Warmwasser** – Einschalt-Differenz für die Warmwasserbereitung.
        **P10 Legionellen: Intervall** – Alle wie viele Tage die Legionellenschaltung läuft.
        **P11 Legionellen: Startzeit** – Uhrzeit (Stunde) des Legionellenprogramms.
        **P12 Legionellen: Dauer** – Haltezeit auf Legionellentemperatur.
        **P13 Legionellen: Temperatur** – Zieltemperatur der Legionellenschaltung.
        **P14 Legionellen: Modus** – 0 = automatisch, 1 = manuell, 2 = ungültig (aus).
        **P18 Reserve** – Laut Werksliste Reserve ohne Funktion (0 = ungültig, 1 = gültig). ⚠️ Modbus-Protokoll (TDB 24.11.2025) nennt hier „DHW AU function“ (Warmwasser nach Heizkurve); beim Nutzer steht 1.
        **P63 Warmwasserfunktion** – 0 = kein Warmwasserspeicher, 1 = WW-Bereitung aktiv.
