    - type: markdown
      title: So wird gerechnet
      grid_options:
        columns: full
      content: '<small>Grundlage ist die <b>Wärme</b>, die die WP laut eigenem Zähler geliefert hat, je Monat.<br><b>WP</b>: Netzstrom × (Arbeitspreis + Netzkosten) + Strom aus PV/Akku × Einspeisevergütung (entgangener Ertrag) + Grundgebühr/12 + Wartung/12.<br><b>Alternativen</b>: Brennstoff = Wärme ÷ Nutzungsgrad (Öl 92 %, Gas 95 %, Pellets 90 %, Holz 75 %); Heizwerte: Öl 10 kWh/l, Pellets 4,9 kWh/kg, Stückholz 1.900 kWh/Raummeter (Hartholz), Gas lt. Umrechnung von der Rechnung. Dazu Grundgebühr (Gas) und Wartung inkl. Rauchfangkehrer je 1/12 pro Monat.<br><b>Gas und Pellets</b>: Es genügt einer der beiden Preise (€/kWh oder €/m³ bzw. €/kg oder €/t), der andere wird umgerechnet.<br><b>CO₂</b>: Klimabilanz Öl 0,310 · Gas 0,247 · Pellets 0,036 · Holz 0,020 kg je kWh Brennstoff, WP nur der Netzstrom mit 0,227 kg/kWh.<br>Gerechnet wird immer mit den aktuell eingetragenen Preisen, auch für vergangene Monate. Monate vor der ersten Messung der Herkunft (*) gelten als Netzstrom. Ohne Netz-Sensor in den Optionen (siehe Seite PV) zählt der gesamte WP-Strom als Netzstrom, die Einspeisevergütung spielt dann keine Rolle.</small>'
- title: Regelung
  path: regelung
  icon: mdi:tune-variant
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      title: Was die Regelung gerade macht
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.wp_raumtemperatur_mittel
          state_not:
          - unavailable
          - unknown
        - condition: state
          entity: switch.wp_eigene_regelung
          state: 'on'
      grid_options:
        columns: full
      content: |-
        {% macro n(v, d=0) %}{{ '–' if v is none or v is undefined else ('%.*f' | format(d, v)) | replace('.', ',') }}{% endmacro %}{% set M = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'] %}{% set a = states.sensor.wp_regelung_verschiebung.attributes if states.sensor.wp_regelung_verschiebung else {} %}**Status:** {{ a.status or '–' }}

        | Baustein | Verschiebung |
        |:--|--:|
        | Grundwert (P09 beim Einschalten) | {{ n(a.grundwert, 1) }} K |
        | Raum-Nachführung (Mittel 3 h {{ n(a.raum_3h, 1) }} °C, 1 h {{ n(a.raum_1h, 1) }} °C, Soll {{ n(a.raum_soll, 1) }} °C) | {{ '%+.1f' | format(a.raum or 0) | replace('.', ',') }} K |
        | Sonnenkorrektur (WP {{ n(a.aussen_wp, 1) }} °C, eigener Fühler {{ n(a.aussen_extern, 1) }} °C) | {{ '%+.1f' | format(a.sonne or 0) | replace('.', ',') }} K |
        | Prognose (jetzt {{ n(a.prognose_jetzt, 1) }} °C, nächste {{ n((a.fein or {}).vorschau, 0) }} h Ø {{ n(a.prognose_mittel, 1) }} °C) | {{ '%+.1f' | format(a.prognose or 0) | replace('.', ',') }} K |
        | Vorladen vor Frost (Prognose-Minimum {{ n(a.prognose_min, 1) }} °C) | {{ '%+.1f' | format(a.vorladen or 0) | replace('.', ',') }} K |
        {% if a.tag_on %}| Wärmste Stunden (Prognose jetzt {{ n(a.tag_jetzt, 1) }} °C, Mittel 24 h {{ n(a.tag_mittel, 1) }} °C) | {{ '%+.1f' | format(a.tag or 0) | replace('.', ',') }} K |
        {% endif %}| **Ziel P09** (jetzt in der WP: {{ n(a.p09, 1) }} K) | **{{ n(a.ziel, 1) }} K** |

        **Heizkurve P08:** {{ n(a.p08, 1) }} °C · Lernen {{ 'an' if a.kurve_lernen else 'aus' }} · {{ a.kurve_punkte or 0 }} Stunden gesammelt{% if a.kurve %} · letzte Auswertung {{ a.kurve.zeit }}: {{ a.kurve.text }}{% endif %}
        {% set sw = states['sensor.wp_schreibvorgange_heute'] %}{% if sw and sw.attributes.gesamt is defined %}
        **Schreibvorgänge in die WP:** heute {{ sw.state }}{% for k, v in (sw.attributes.je_parameter or {}).items() %}{{ ' (' if loop.first else ' · ' }}{{ k }} {{ v }}{{ ')' if loop.last }}{% endfor %} · gesamt {{ sw.attributes.gesamt }} seit {{ sw.attributes.seit }}
        {% endif %}
        <details><summary>So rechnet die Regelung</summary><small>Die eingebaute Heizkurve der WP bleibt aktiv, die Regelung verschiebt sie nur (höchstens ± {{ n(a.max, 1) }} K um den Grundwert, einstellbar 2–10 K). {% set f = a.fein or {} %}Raum (Profil unter „Feineinstellung“): mehr als {{ n(f.kalt_ab, 1) }} K zu kalt (Mittel 1 h) → alle {{ n(f.kalt_abstand, 0) }} min je K {{ n(f.kalt_faktor, 1) }} K hoch (höchstens {{ n(f.kalt_max, 1) }} K), sonst mehr als {{ n(f.totband, 1) }} K zu kalt (Mittel 3 h) → alle {{ n(f.langsam_abstand, 0) }} min +{{ n(f.langsam_schritt, 1) }} K; seit {{ n(f.warm_dauer, 0) }} min durchgehend mehr als {{ n(f.totband, 1) }} K zu warm → alle {{ n(f.warm_abstand, 0) }} min je K {{ n(f.warm_faktor, 1) }} K zurück (höchstens {{ n(f.warm_max, 1) }} K). Prognose: wird es in den nächsten {{ n(f.vorschau, 0) }} h laut Wetter ({{ a.wetter or 'keine Wetter-Entität' }}) kälter, hebt sie die Kurve vorab an, wird es wärmer, senkt sie (Gewichtung {{ n(f.prog_gewicht, 0) }} %, höchstens ± 3 K; 0 % = aus). Der Raum-Baustein lernt nur so weit, wie er unter der Grenze noch wirkt (kein Aufschaukeln); andere Raumfühler gewählt → beginnt neu bei 0 K. Sonne: gleicht aus, wenn der WP-Fühler in der Sonne wärmer misst als dein Fühler (Steigung der Heizkurve {{ n(a.steigung, 2) }} K/K). Vorladen: bei angesagtem Frost unter 3 °C tagsüber bis +2 K. Geschrieben wird erst ab 0,5 K Änderung und höchstens alle 30 min; <b>gegen Takten</b>: Sonnenkorrektur über 60 min gemittelt, je Schritt höchstens +2 K / −1 K, Absenken bei laufendem Kompressor erst, wenn der Vorlauf unter dem neuen Soll liegt (sonst stoppt die WP), und nach 3 Kompressorstarts in 2 h werden 2 h lang keine Änderungen gemacht; jede Änderung steht im Logbuch. Ausschalten stellt den Grundwert wieder her. Fällt Home Assistant aus, heizt die WP mit ihrer Kurve weiter.<br><br><b>Heizkurve P08:</b> Ändert sich P08 (von Hand, am Display oder durch das Lernen), rechnet die Regelung aus, wie stark sich das Soll bei der jetzigen Außentemperatur ändert, und gleicht die Raum-Nachführung um genau so viel aus. So korrigieren Kurve und Regelung nicht doppelt. P08 ändert also vor allem, wie stark die Kurve bei <i>anderen</i> Außentemperaturen ansteigt; für wärmer/kühler insgesamt ist das Raum-Soll da. <b>Lernen</b> (Schalter): einmal am Tag ab 14 Uhr schaut die Regelung auf die letzten 3 Tage. Zieht sie umso mehr ab, je kälter es ist, ist die Kurve zu steil → P08 runter; gibt sie umso mehr dazu, je kälter es ist → P08 rauf. Gestellt wird gedämpft (höchstens 1 °C am Tag, Bereich 40–55 °C) und nur, wenn mindestens 24 Stunden mit 3 K Temperaturspanne und ein klarer Zusammenhang da sind. Fällt HA aus, behält die WP die zuletzt gelernte Kurve.<br><br><b>Wärmste Stunden</b> (Schalter unter „Feineinstellung“): Ist es laut Prognose jetzt wärmer als im Mittel der nächsten 24 h, hebt die Regelung die Kurve an, ist es kälter, senkt sie ab – die WP heizt so mehr, wenn die Luft warm ist (je K wärmer ~2–3 % besserer COP). Verschiebung = Stärke × (jetzt − Mittel) × Steigung, höchstens ± „höchstens“. Angehoben wird nur bis Raum = Soll + 0,5 K, abgesenkt nur bis Soll − 0,5 K. Solange er an ist, sind Totband und „deutlich zu kalt“ der Raum-Nachführung um 0,3 K weiter (sie soll die gewollte Schwankung nicht wegregeln), und Stunden mit mehr als ± 1 K zählen nicht für das Heizkurven-Lernen.</small></details>
    - type: custom:avarma-history-card
      title: Verlauf 48 h
      hours_to_show: 48
