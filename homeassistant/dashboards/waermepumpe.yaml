- title: Übergangszeit
  path: uebergang
  icon: mdi:weather-partly-cloudy
  type: sections
  max_columns: 3
  dense_section_placement: false
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: markdown
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: switch.wp_uz_hinweis_bestatigt
        state_not: 'on'
      content: |-
        <ha-alert alert-type="error" title="Achtung – auf eigene Gefahr!">Diese Regelung schreibt mit dem <b>Technikerzugang</b> selbstständig Techniker-Parameter in die Wärmepumpe (P60 Lüfter max. Drehzahl, P45 Kompressor max. Frequenz, P114 Frequenzreduktion bei VL-Soll). Falsche Werte können zu Störungen, Vereisung, zu wenig Leistung oder Schäden führen. Benutzung auf eigene Gefahr – im Zweifel Hersteller oder Fachbetrieb fragen.</ha-alert>

        **Außenfühler:** wählbar. Der WP-Fühler misst bei Sonne oft deutlich zu warm (bis +19 K gemessen) – „Kleinerer Wert von beiden“ ist am vorsichtigsten.

        **Wozu:** In der Übergangszeit (mild draußen) braucht das Haus wenig Wärme. Die WP läuft dann mit voller Leistung an, erreicht das Soll schnell und schaltet ab – sie **taktet**. Mit weniger Lüfter, niedrigerer Höchstfrequenz und mehr Frequenzreduktion moduliert sie weiter herunter und läuft länger durch.

        **Voraussetzung:** Hinweis unten bestätigen und Techniker-Code in **Einstellungen → Geräte & Dienste → Avarma → Konfigurieren** hinterlegt – sonst lässt sich die Übergangszeit nicht einschalten. Ausschalten geht immer und stellt sofort die Normalwerte wieder her.
