        **P02 Vorlauf-Soll Heizen** – Ziel-Vorlauftemperatur im Heizbetrieb (ohne Heizkurve). Nach einem Neustart der WP evtl. wieder 45 °C.
        **P03 Soll Kühlen** – Ziel-Vorlauftemperatur im Kühlbetrieb.
        **P05 Raum-Soll** – Raum-Solltemperatur, in der Smart-Life-App „R1_setting“ (steht dort bei Nachtmodus Ein/Aus, hat aber nichts mit dem Nachtmodus zu tun). Nur mit Raumfühler/Thermostat (P67) wirksam.
        **P06 Hysterese Heizen/Kühlen** – Um so viel muss der Vorlauf unter den Sollwert fallen, bis die WP wieder startet. Größer = weniger Takte, aber größere Schwankung.
        **P08 Heizkurve: max. Vorlauf** – Höchster Vorlauf der Heizkurve (AU) am kalten Ende, bestimmt damit die Steigung. Untergrenze der Kurve ist P146.
        **P09 Heizkurve: Verschiebung** – Parallelverschiebung der Heizkurve (+ = wärmer, − = kühler).
        **P19 Heizkurve (AU) aktiv** – 1 = Vorlauf wird nach Außentemperatur geführt (Heizkurve), 0 = fester Vorlauf-Soll P02.
        **P135 Heizgrenze (Heizkurve)** – Werksliste: „AU heating limiting temperature“. Über dieser Außentemperatur heizt die WP nach Heizkurve nicht (Sommerabschaltung).
