        {% endif %}
        <details><summary>So arbeitet die Übergangszeit</summary><small>Ab der eingestellten Außentemperatur (Mittel 30 min) werden die Werte der Übergangszeit geschrieben, unter „ab − Hysterese“ wieder die Normalwerte. Umgeschaltet wird höchstens einmal pro Stunde (kein Hin und Her). Jeder Wert wird nach dem Schreiben zurückgelesen; nimmt die WP ihn nicht an, steht das im Verlauf und es wird erst nach 1 h erneut versucht. Normalwerte: solange die Übergangszeit nicht gilt, wird übernommen, was in der WP steht (z. B. am Display geändert). Während der Übergangszeit setzt die Regelung ihre Werte – Änderungen bitte hier machen.<br><br><b>Kompressor-Stufen:</b> Unterhalb der Übergangszeit stellen sie P45 (Höchstfrequenz) nach Außentemperatur: Es gilt die wärmste Stufe, deren Grenze erreicht ist, unter der kältesten der Wert „Darunter“ (höchstens der Werkswert P45 des gewählten Modells, bei 9 kW 85 Hz – volle Leistung bei Frost). Der Normalwert gilt nur, wenn die Stufen aus sind. In eine kältere Stufe (mehr Leistung) geht es sofort, sobald es 1 K unter der Grenze ist; in eine wärmere höchstens einmal pro Stunde. Zweck: mild kleinere Frequenzspitzen nach dem Abtauen, besserer COP, leiser; bei Frost die volle Leistung. Wird es im Raum zu kalt, die Hz der Stufe erhöhen oder die Grenze senken.</small></details>
