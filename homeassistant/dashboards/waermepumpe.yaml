        ## Fehlercodes (Betriebsanleitung V06)
        <details><summary>Alle Codes E01–E99 anzeigen</summary>

        | Code | Bedeutung | Bemerkung |
        |---|---|---|
        | E01 | Sensorfehler Außenlufttemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E02 | Sensorfehler Verdampfertemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E03 | Sensorfehler Ansaugtemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E04 | Sensorfehler EVI-Einlasstemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E05 | Sensorfehler EVI-Auslasstemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E06 | Sensorfehler Verdichtungstemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E07 | Sensorfehler Trinkwassertemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E08 | Sensorfehler Austrittstemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E09 | Sensorfehler Eintrittstemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E10 | Sensorfehler Kältemitteltemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E11 | Sensorfehler Hochdruck | Sensor defekt, Unterbrechung oder Kurzschluss, Platine (PCB) defekt. |
        | E12 | Sensorfehler Niederdruck | Sensor defekt, Unterbrechung oder Kurzschluss, Platine (PCB) defekt. |
        | E13 | Hochdruckschutz | Zu viel Kältemittel, Fehler am Drosselorgan (EEV) oder Drucksensorfehler. |
        | E14 | Niederdruckschutz | Zu wenig Kältemittel, Fehler am Drosselorgan (EEV) oder Drucksensorfehler. |
        | E15 | Störung Wasserdurchfluss | Zu geringe Wasserdurchflussmenge oder Störung des Durchflussschalters. |
        | E16 | Kommunikationsfehler | Kommunikationsfehler zwischen Hauptplatine und Regler. |
        | E17 | Schutz gegen zu hohe Verdichtungstemperatur | Zu wenig Kältemittel oder Fehler am Drosselorgan (EEV). |
        | E18 | EEPROM-Parameterfehler | In der Betriebsanleitung V06 als „reserviert“ geführt; Bedeutung laut Modbus-Protokoll. |
        | E20 | Schutz IPM | IPM-Modul (Leistungsteil des Verdichterantriebs) hat abgeschaltet – Unternummer E20-x am Display beachten. |
        | E21 | Spannungsfehler | In der Betriebsanleitung V06 als „reserviert“ geführt; Bedeutung laut Modbus-Protokoll. |
        | E22 | Wassertemperaturdifferenz zu hoch | Umwälzpumpe und Wasserfilter (Schmutzfänger) prüfen. |
        | E23 | Trinkwasser-Frostschutz 2× | Die Frostschutzfunktion im Trinkwasserbetrieb wurde 2× binnen 60 Minuten aktiviert. |
        | E24 | AC-Frostschutz 2× | Die Frostschutzfunktion im Heiz-/Kühlbetrieb wurde 2× binnen 90 Minuten aktiviert. |
        | E26 | Sensorfehler Temperatur T6 | Fühler: Unterbrechung oder Kurzschluss. |
        | E27 | Umgebungstemperatur über Obergrenze | Umgebungstemperatur über 45 °C. |
        | E28 | Wassereintrittstemperatur zu hoch (Kühlen) | Kühlen: Wassereintritt über 40 °C. Ausschalten und Wasser vor dem Einschalten unter 40 °C abkühlen lassen. |
        | E29 | Sensorfehler Raumtemperatur | Fühler: Unterbrechung oder Kurzschluss. |
        | E32 | Wasseraustrittstemperatur zu hoch (Heizen) | Austrittstemperatur über 75 °C. Umwälzpumpe und Wasserfilter prüfen. |
        | E36 | Kommunikationsfehler DC-Lüfterplatine | Kommunikationskabel zur Lüfterplatine prüfen. |
        | E40 | Wasseraustrittstemperatur zu niedrig (Kühlen) | Austrittstemperatur unter 5 °C. Umwälzpumpe und Wasserfilter prüfen. |
        | E44 | Störung DC-Lüftermotor 1 | Motorleitung prüfen oder Motor defekt. |
        | E45 | Störung DC-Lüftermotor 2 | Motorleitung prüfen oder Motor defekt. |
        | E50 | Schutz gegen hohe Verdampfertemperatur | Zu wenig Kältemittel, Störung am Drosselorgan (EEV) oder Verdampferfühler defekt. |
        | E51 | Kältemittel-Konzentration hoch (Leck!) | In der Betriebsanleitung V06 als „reserviert“ geführt; Bedeutung laut Modbus-Protokoll. Keine Zündquellen, lüften, WP stromlos schalten, Fachbetrieb rufen. |
        | E56 | Primärstrom-Schutz | In der Betriebsanleitung V06 als „reserviert“ geführt; Bedeutung laut Modbus-Protokoll. |
        | E58 | Umgebungstemperatur unter unterer Grenze | Außentemperatur unter der Grenze aus P82. |
        | E59 | VL/RL vertauscht oder 4-Wege-Ventil | In der Betriebsanleitung V06 als „reserviert“ geführt; Bedeutung laut Modbus-Protokoll. |
        | E99 | Kommunikationsstörung Inverter | Kommunikationsstörung zwischen Hauptplatine und Inverterplatine. |

        Nicht aufgeführte Codes sind in der Anleitung reserviert.
        </details>

        <details><summary>Treiberfehler E20-x (Unternummer am Display)</summary>

        | Code | Bedeutung | Bemerkung |
        |---|---|---|
        | E20-1 | IPM-Störung | Strom oder Temperatur des IPM-Moduls zu hoch. |
        | E20-4 | Warnung: Frequenzabsenkung durch IPM-Temperatur | Treiberfehler. |
        | E20-5 | Verdichterantriebsstörung (außer IPM) | Phasenausfall, Schrittverlust oder Antriebs-Hardware beschädigt. |
        | E20-16 | DC-Bus-Unterspannung | DC-Bus-Spannung ≤ Abschaltwert. |
        | E20-32 | DC-Bus-Überspannung | DC-Bus-Spannung ≥ Abschaltwert. |
        | E20-257 | Kommunikation mit der Hauptplatine gestört | Treiber erhält 200 s lang keine Daten. |
        | E20-258 | Phasenausfall | Stromwandler beschädigt oder falsch eingesetzt; bei Leerlauf über 40 Hz Fehlerkennung möglich. |
        | E20-260 | AC-Eingangsstrom: Überstromabschaltung | Last steigt zu schnell, Verdichter überlastet, Druckdifferenz Hoch-/Niederdruck zu groß. |
        | E20-261 | Warnung: Frequenzabsenkung durch AC-Eingangsstrom | Treiberfehler. |
        | E20-264 | AC-Eingangsspannung zu hoch oder zu niedrig |  |
        | E20-288 | IPM-Übertemperaturabschaltung | Schlechte Wärmeabfuhr, Lüfter langsam oder steht, Umgebungstemperatur steigt zu schnell. |
        | E20-290 | Warnung: Frequenzabsenkung durch Verdichterstrom | Treiberfehler. |
        | E20-291 | Überstrom beim Beschleunigen | Treiberfehler. |
        | E20-292 | Überstrom beim Verlangsamen | Treiberfehler. |
        | E20-293 | Überstrom bei konstanter Drehzahl | Treiberfehler. |
        | E20-294 | Überspannung beim Beschleunigen | Treiberfehler. |
        | E20-295 | Überspannung beim Verlangsamen | Treiberfehler. |
        | E20-296 | Überspannung bei konstanter Drehzahl | Treiberfehler. |
        | E20-297 | Schrittverlust (Verdichter läuft ungleichmäßig) | Treiberfehler. |
        | E20-298 | IPM-Modul: Hardwareschutz ausgelöst | IPM-Modulschutz. |
        | E20-299 | Stromerfassung fehlerhaft | Stromerfassungsmodul gestört. |
        | E20-320 | Verdichterüberstrom | Zeitweise Überlast (z. B. Flüssigkeitsschlag), Programm passt nicht zum Verdichter, U/V/W vertauscht (läuft rückwärts) oder Verschleiß. |
        | E20-384 | PFC-Störung (Leistungsfaktorkorrektur) | PFC-Bauteil defekt, Strom-/Spannungseinbruch im Netz, Überlastschutz oder Steuerungsfehler. |

        Die Integration liest den Treiberstatus als Bitregister und zeigt ihn als „E20 Treiber: …“. Wie die Bits den Unternummern entsprechen, ist noch nicht bestätigt – im Zweifel gilt die Anzeige am Display.
        </details>
