- title: PV
  path: pv
  icon: mdi:solar-power-variant
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: markdown
      title: PV-Anteil einrichten
      visibility:
      - condition: state
        entity: sensor.wp_netzanteil_strom_heute
        state: unavailable
      grid_options:
        columns: full
      content: |-
        Diese Seite zeigt, wie viel Strom der Wärmepumpe aus **PV**, **Akku** und **Netz** kommt. Dafür braucht die Integration die Netzleistung deines Hauses:

        **Einstellungen → Geräte & Dienste → Avarma → Konfigurieren**

        - **Netzleistung des Hauses**: Sensor in W, **+ = Bezug** aus dem Netz, − = Einspeisung (z. B. Smart Meter, Shelly 3EM, Wechselrichter)
        - **Akkuleistung** (optional): Sensor in W, **+ = Laden, − = Entladen**; zählt dein Sensor umgekehrt, den Schalter darunter einschalten

        Danach rechnet die Integration rückwirkend ab Jahresbeginn nach (soweit Home Assistant Statistiken hat). Details im README.
    - type: custom:avarma-source-card
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: sensor.wp_netzanteil_strom_heute
        state_not: unavailable
  - type: grid
    column_span: 2
    cards:
    - type: custom:avarma-bar-card
      entity: sensor.wp_heizkosten_wp_jahr
      title: Je Tag (letzte 30 Tage)
      period: tage
      field: ''
      stacked: true
      decimals: 1
      unit: kWh Strom der WP je Tag
      series:
      - key: pv
        name: PV
        color: '#fbc02d'
      - key: akku
        name: Akku
        color: '#26a69a'
      - key: netz
        name: Netz
        color: '#ef5350'
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: sensor.wp_netzanteil_strom_heute
        state_not: unavailable
    - type: custom:avarma-bar-card
      entity: sensor.wp_heizkosten_wp_jahr
      title: Je Monat
      period: monate
      field: ''
      stacked: true
      decimals: 0
      unit: kWh Strom der WP je Monat
      series:
      - key: pv
        name: PV
        color: '#fbc02d'
      - key: akku
        name: Akku
        color: '#26a69a'
      - key: netz
        name: Netz
        color: '#ef5350'
      grid_options:
        columns: full
      note: Monate vor der ersten Messung der Herkunft sind mit dem Jahresanteil geschätzt.
      visibility:
      - condition: state
        entity: sensor.wp_netzanteil_strom_heute
        state_not: unavailable
