        **P38 Lüfter-Kennlinie Kühlen** – Faktor für die Lüfterdrehzahl im Kühlbetrieb.
        **P60 Lüfter max. Drehzahl** – Höchste Lüfterdrehzahl in 10 U/min (63 = 630 U/min, Bereich 500–1500).
        **P69 Lüftertyp** – 0 = AC, 1 = erster DC, 2 = zweiter DC, 3 = zwei DC-Lüfter.
        **P71 Lüftersteuerung** – 1 = automatisch, 0 = manuell mit P72 (Vereisungsgefahr!).
        **P72 Lüfter manuelle Drehzahl** – Nur bei P71 = 0. 40 = 400 U/min.
