name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # topics/license sind nur für die Aufnahme in den HACS-Standardkatalog nötig,
          # nicht für die Installation als benutzerdefiniertes Repository (Button im README)
          ignore: brands topics license
